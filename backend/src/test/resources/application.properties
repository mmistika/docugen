spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=com.artembilous.docugen.dialect.TestH2Dialect
spring.jpa.hibernate.ddl-auto=none
cors.allowed-origins=http://localhost:5173
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://docugen.eu.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=docugen-api
